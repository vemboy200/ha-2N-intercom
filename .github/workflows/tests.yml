name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install voluptuous aiohttp
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t tests
      - name: Validate integration
        run: python3 validate.py
      - name: Syntax check
        run: python3 -m py_compile custom_components/2n_intercom/*.py
